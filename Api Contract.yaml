            - NO_SESSION
            - SESSION_EXISTS
            - ORDER_NOT_OPEN
            - ORDER_COMPLETED
            - BASKET_EMPTY
            - INVALID_INPUT
            - NOT_FOUND
            - CONFLICT
            - INSUFFICIENT_STOCK
            - PIN_REQUIRED
            - INVALID_CREDENTIALS
        message:
          type: string
    Manager:
      type: object
      properties:
        manager_id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    Employee:
      type: object
      properties:
        pos_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
