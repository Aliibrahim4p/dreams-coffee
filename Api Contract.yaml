  /sync/heartbeat:
    get:
      tags:
        - Sync
      summary: Connectivity check (FR-036, FR-040)
      description:
        "Polled every 5 seconds. Two consecutive misses (10 seconds) put
        the

        client into offline mode within 1 second: orders and payments keep

        being accepted locally, a persistent banner shows, and records queue

        for sync. Cashier input is never blocked by connection loss.

        "
      security: []
      responses:
        "200":
          description: Online
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    format: date-time
  /sync/records:
    post:
      tags:
        - Sync
      summary: Push queued local records to the cloud (FR-035, FR-037, FR-038)
      description:
        "Local-first: the terminal commits every order, deduction and closed

        session to local storage BEFORE any sync is attempted. The closed

        session is the cash-up record of FR-035. Records then sync

        individually and immediately whenever connectivity allows, and the

        reconciliation sweep retries anything unsynced every 10 minutes until

        the cloud confirms it.


        Each record is all-or-nothing. A partial or corrupted record is

        rejected outright rather than half-accepted, and stays queued — no

        partial state ever reaches the cloud (FR-037).


        Confirmed records come back with the server timestamp the client

        writes into `synced_at`, alongside `sync_status: synced`.

        "
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - records
              properties:
                records:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - record_type
                      - record_id
                      - payload
                    properties:
                      record_type:
                        type: string
                        enum:
                          - order
                          - shift_session
                          - delivery
                          - inventory_count_entry
                      record_id:
                        type: integer
                      payload:
                        type: object
                        description: The full local row
      responses:
        "200":
          description: Per-record results — confirmed or rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        record_type:
                          type: string
                        record_id:
                          type: integer
                        sync_status:
                          type: string
                          enum:
                            - synced
                            - failed
                        synced_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: Server confirmation time; null when failed
                        error:
                          type: string
                          nullable: true
                          description: Reason, e.g. corrupted or partial record
        "401":
          $ref: "#/components/responses/Unauthenticated"
