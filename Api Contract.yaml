      responses:
        "204":
          description: Deactivated — is_active set to false
        "401":
          $ref: "#/components/responses/ManagerRequired"
        "404":
          description: Product not found
components:
  securitySchemes:
    activeSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description:
        "Identifies the open `shift_session` on this device. Resolved against

        the database on every request: the row must exist and have

        `end_time = null`.


        That is the whole check for a transaction. Not a manager credential

        — the manager unlocked the terminal this morning and left; the

        cashier works the rest of the day on this open session alone.


        Dies at cash-out, when `end_time` is set. Every transaction endpoint

        then returns 409 until a new session is opened, which itself

        requires the PIN gate (FR-010).

        "
    panelToken:
      type: apiKey
      in: header
      name: X-Panel-Token
      description:
        "Manager Panel open via the shared PIN (FR-010, AUTH-GATE-01).
        Short

        TTL, carries no identity. Covers everything inside the panel: cashier

        login, cash-out, voids, clear, refunds. Only ever valid alongside a

        live session — the PIN alone grants nothing.

        "
    managerToken:
      type: apiKey
      in: header
      name: X-Manager-Token
      description:
        "A named manager authenticated by username and password. Required
        for

        inventory counts, deliveries, and config — the admin-PC surface.

        Also a server-side session record, same rules as above.

        "
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
    LineItemId:
      name: line_item_id
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: integer
    CountId:
      name: count_id
      in: path
      required: true
      schema:
        type: integer
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: integer
    ManagerId:
      name: manager_id
      in: path
      required: true
      schema:
        type: integer
    PosId:
      name: pos_id
      in: path
      required: true
      schema:
        type: integer
    IncludeInactive:
      name: include_inactive
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When true, includes deactivated records in the response
  responses:
    Unauthenticated:
      description:
        "No open cash session on this device — the token is missing, unknown,

        or its session has been cashed out. Also what an unauthenticated

        caller hitting the server directly receives, since they have no

        session at all.

        "
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IncorrectCredentials:
      description: Incorrect credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PanelRequired:
      description:
        Manager Panel not open, or panel token expired — action did not
        execute and nothing changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ManagerRequired:
      description: Manager username/password authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderNotOpen:
      description: Order is not open — completed orders cannot be modified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code — see ErrorCode enum
        message:
          type: string
          description: Human-readable error message
    ShiftSession:
      type: object
      properties:
        session_id:
          type: integer
        cashier_pos_id:
          type: integer
        starting_float:
          type: number
          format: decimal
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
          description: null while open; set at cash-out — this IS the cash-out event
        live_cash_total:
          type: number
          format: decimal
        sync_status:
          type: string
          enum:
            - pending
            - synced
            - failed
        synced_at:
          type: string
          format: date-time
          nullable: true
    ShiftSessionDetail:
      allOf:
        - $ref: "#/components/schemas/ShiftSession"
        - type: object
          properties:
            cashier_first_name:
              type: string
              description: From the joined employee row — terminal header (FR-007)
            cashier_last_name:
              type: string
            open_order:
              type: object
              allOf:
                - $ref: "#/components/schemas/OrderDetail"
              nullable: true
              description: The recoverable basket, if one was open (FR-041)
    ClosedSession:
      allOf:
        - $ref: "#/components/schemas/ShiftSession"
        - type: object
          properties:
            gross_sales:
              type: number
              format: decimal
              description:
                "LBP, summed from this session's completed orders at response

                time. Derived, never stored — refunds are negative orders, so

                they net out of the same sum.

                "
            transaction_count:
              type: integer
    Category:
      type: object
      properties:
        category_id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
    CategoryWithProducts:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/ProductWithSizes"
              description: Each product includes its available sizes
    Product:
      type: object
      properties:
        product_id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
            - recipe_based
            - reseller
        base_price:
          type: number
          format: decimal
          description: LBP
        is_active:
          type: boolean
    ProductSizeOption:
      type: object
      properties:
        modifier_id:
          type: integer
          nullable: true
        modifier_name:
          type: string
          nullable: true
        price_adjustment:
          type: number
          format: decimal
        resolved_price:
          type: number
          format: decimal
        available:
          type: boolean
          description: false for resellers; true for recipes (V1)
    RecipeDetail:
      type: object
      description: One product+size recipe with its ingredient lines
      properties:
        recipe_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        modifier_id:
          type: integer
          nullable: true
          description: null for resellers, which have exactly one sizeless recipe
        modifier_name:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: integer
              item_name:
                type: string
              quantity:
                type: number
                format: decimal
                description: Deducted per single unit sold; always 1 for resellers
              unit:
                type: string
                enum:
                  - g
                  - ml
                  - piece
                description: Matches the inventory item's unit; 'piece' for resellers
    LineItemInput:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
        modifier_id:
          type: integer
          nullable: true
          description: Required for recipe-based products; null for resellers
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      properties:
        order_id:
          type: integer
        session_id:
          type: integer
        transaction_type:
          type: string
          enum:
            - sale
            - refund
        order_type:
          type: string
          enum:
            - dine_in
            - take_out
          nullable: true
          description: null on refunds — a refund is neither dine-in nor take-out
        status:
          type: string
          enum:
            - open
            - completed
        total_due:
          type: number
          format: decimal
          description: LBP; negative on refunds
        cash_tendered:
          type: number
          format: decimal
          nullable: true
        change_given:
          type: number
          format: decimal
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Basket-open time
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Checkout time — the receipt timestamp
        sync_status:
          type: string
          enum:
            - pending
            - synced
            - failed
        synced_at:
          type: string
          format: date-time
          nullable: true
        order_number:
          type: integer
          description: Sequential receipt number starting at 100, unique per order
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            line_items:
              type: array
              items:
                $ref: "#/components/schemas/OrderLineItem"
    OrderLineItem:
      type: object
      properties:
        line_item_id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
          description: Joined
          # for_display_and_receipts: null
        modifier_id:
          type: integer
          nullable: true
        modifier_name:
          type: string
          nullable: true
        quantity:
          type: integer
          description: Negative on refund orders
        unit_price:
          type: number
          format: decimal
          description:
            LBP, snapshotted at add-time so later price changes never alter
            a placed order
        line_total:
          type: number
          format: decimal
          description: unit_price × quantity
    Receipt:
      type: object
      description: Exactly the fields FR-019 mandates
      properties:
        header:
          type: string
          enum:
            - SALE
            - REFUND
          description:
            From transaction_type — REFUND prints at the top for refunds
            (FR-034)
        order_id:
          type: integer
        cashier_first_name:
          type: string
        cashier_last_name:
          type: string
        cashier_pos_id:
          type: integer
        printed_datetime:
          type: string
          format: date-time
          description: completed_at, to the minute
        order_type:
          type: string
          enum:
            - dine_in
            - take_out
          nullable: true
        line_items:
          type: array
          items:
            type: object
            properties:
              product_name:
                type: string
              modifier_name:
                type: string
                nullable: true
              quantity:
                type: integer
              unit_price:
                type: number
                format: decimal
              line_total:
                type: number
                format: decimal
        total_due:
          type: number
          format: decimal
        cash_tendered:
          type: number
          format: decimal
          nullable: true
        change_given:
          type: number
          format: decimal
          nullable: true
    DailySalesReport:
      type: object
      properties:
        business_date:
          type: string
          format: date
        total_revenue:
          type: number
          format: decimal
        transaction_count:
          type: integer
          description:
            "\n        Count of net transactions: sales minus refunds.\
            \ Refunds count as -1\n        (they're orders with negative total_due),\
            \ so a day with 10 sales and\n        2 refunds reports 8 net transactions.\n"
        net_total:
          type: number
          format: decimal
          description: Revenue minus refunds
        generated_at:
          type: string
          format: date-time
    InventoryItem:
      type: object
      properties:
        item_id:
          type: integer
        name:
          type: string
        unit:
          type: string
          enum:
            - g
            - ml
            - piece
        current_stock:
          type: number
          format: decimal
          description: Theoretical system stock; may be negative (FR-028)
        count_frequency:
          type: string
          enum:
            - daily
            - monthly
        is_negative_flag:
          type: boolean
        is_active:
          type: boolean
    PackConfiguration:
      type: object
      properties:
        config_id:
          type: integer
        item_id:
          type: integer
        pack_name:
          type: string
          description: e.g. Box of Milk, Bag of Sugar
        base_unit_qty:
          type: number
          format: decimal
          description: Base units yielded by one of this pack
    InventoryCountEntry:
      type: object
      properties:
        count_id:
          type: integer
        item_id:
          type: integer
        item_name:
          type: string
        manager_id:
          type: integer
        physical_count:
          type: number
          format: decimal
        expected_stock:
          type: number
          format: decimal
          description: Read from current_stock at response time — not stored
        variance:
          type: number
          format: decimal
          description:
            physical_count − expected_stock, signed. Computed, never stored
            (FR-026)
        entry_date:
          type: string
          format: date
        is_locked:
          type: boolean
        sync_status:
          type: string
          enum:
            - pending
            - synced
            - failed
        synced_at:
          type: string
          format: date-time
          nullable: true
    Supplier:
      type: object
      properties:
        supplier_id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
    DeliveryDetail:
      type: object
      properties:
        delivery_id:
          type: integer
        manager_id:
          type: integer
        supplier_id:
          type: integer
        supplier_name:
          type: string
        date_received:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        sync_status:
          type: string
          enum:
            - pending
            - synced
            - failed
        synced_at:
          type: string
          format: date-time
          nullable: true
        line_items:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: integer
              item_name:
                type: string
              config_id:
                type: integer
              pack_name:
                type: string
              qty_received:
                type: number
                format: decimal
                description: Count of the pack, as entered
              base_units_added:
                type: number
                format: decimal
                description:
                  qty_received × base_unit_qty — what was committed to
                  stock
              cost_per_unit:
                type: number
                format: decimal
                description: LBP per pack
    ExchangeRate:
      type: object
      properties:
        rate_value:
          type: number
          format: decimal
          description: LBP per 1 USD
        updated_at:
          type: string
          format: date-time
    ProductWithSizes:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            sizes:
              type: array
              items:
                $ref: "#/components/schemas/ProductSizeOption"
    ErrorCode:
      type: object
      properties:
        code:
          type: string
          enum:
            - TERMINAL_LOCKED
            - NO_SESSION
            - SESSION_EXISTS
            - ORDER_NOT_OPEN
            - ORDER_COMPLETED
            - BASKET_EMPTY
            - INVALID_INPUT
            - NOT_FOUND
            - CONFLICT
            - INSUFFICIENT_STOCK
            - PIN_REQUIRED
            - INVALID_CREDENTIALS
        message:
          type: string
    Manager:
      type: object
      properties:
        manager_id:
          type: integer
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    Employee:
      type: object
      properties:
        pos_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
